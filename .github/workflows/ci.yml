name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: geofs, POSTGRES_PASSWORD: geofs, POSTGRES_DB: geofs }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U geofs" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env: { TEST_DATABASE_URL: "postgres://geofs:geofs@localhost:5432/geofs" }
      - run: npm run build
