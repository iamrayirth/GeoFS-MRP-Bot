services:
  bot:
    build: .
    restart: unless-stopped          # automatic restart after crashes and host reboots
    env_file: .env
    environment:
      STATE_DIR: /app/state          # state.json lives on the named volume below
    volumes:
      - botstate:/app/state
    # Uncomment to reach the health endpoint from the host (e.g. for an external uptime monitor):
    # ports: ["127.0.0.1:8080:8080"]
    stop_grace_period: 20s           # lets the bot flush state.json on SIGTERM
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

# Run exactly ONE replica: state.json has a single-instance lock and is not shared between hosts.
volumes:
  botstate:
